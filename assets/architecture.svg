<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" font-family="Georgia, 'Times New Roman', serif">
  <rect width="920" height="520" rx="14" fill="#F4EEE1"/>
  <rect x="6" y="6" width="908" height="508" rx="10" fill="none" stroke="#2B2622" stroke-width="1.5"/>
  <text x="460" y="44" text-anchor="middle" font-size="23" fill="#2B2622" letter-spacing="1">Architecture at a glance</text>
  <text x="460" y="67" text-anchor="middle" font-size="12.5" fill="#6B6259" font-style="italic">free work runs on everything; paid work runs only on the shortlist</text>

  <!-- capture -->
  <rect x="40" y="110" width="150" height="70" rx="8" fill="#FBF7EE" stroke="#2B2622" stroke-width="1.5"/>
  <text x="115" y="140" text-anchor="middle" font-size="14" fill="#2B2622">Capture</text>
  <text x="115" y="159" text-anchor="middle" font-size="10.5" fill="#6B6259">human-in-the-loop</text>
  <text x="115" y="173" text-anchor="middle" font-size="10.5" fill="#6B6259">browser extension</text>

  <!-- API + SPA -->
  <rect x="250" y="96" width="180" height="98" rx="8" fill="#FBF7EE" stroke="#2B2622" stroke-width="1.5"/>
  <text x="340" y="124" text-anchor="middle" font-size="14" fill="#2B2622">API + web app</text>
  <text x="340" y="144" text-anchor="middle" font-size="10.5" fill="#6B6259">REST + no-build SPA</text>
  <text x="340" y="160" text-anchor="middle" font-size="10.5" fill="#6B6259">deterministic ROI on read</text>
  <text x="340" y="176" text-anchor="middle" font-size="10.5" fill="#6B6259">enqueues background jobs</text>

  <!-- DB -->
  <ellipse cx="340" cy="250" rx="92" ry="30" fill="#EAE0CC" stroke="#2B2622" stroke-width="1.5"/>
  <text x="340" y="248" text-anchor="middle" font-size="13" fill="#2B2622">Database</text>
  <text x="340" y="265" text-anchor="middle" font-size="10" fill="#6B6259">items · comps · outcomes</text>

  <!-- worker -->
  <rect x="250" y="320" width="180" height="150" rx="8" fill="#FBF7EE" stroke="#2B2622" stroke-width="1.5"/>
  <text x="340" y="346" text-anchor="middle" font-size="14" fill="#2B2622">Worker</text>
  <text x="340" y="364" text-anchor="middle" font-size="10.5" fill="#6B6259">single polling loop</text>
  <line x1="266" y1="374" x2="414" y2="374" stroke="#CDBFA6"/>
  <text x="340" y="392" text-anchor="middle" font-size="10.5" fill="#6B6259">triage · price refresh</text>
  <text x="340" y="408" text-anchor="middle" font-size="10.5" fill="#6B6259">final-price capture</text>
  <text x="340" y="424" text-anchor="middle" font-size="10.5" fill="#6B6259">deep valuation · research</text>
  <text x="340" y="440" text-anchor="middle" font-size="10.5" fill="#6B6259">comp harvest</text>
  <text x="340" y="458" text-anchor="middle" font-size="10.5" fill="#6B6259">calibration · backtest</text>

  <!-- local vision -->
  <rect x="640" y="120" width="210" height="86" rx="8" fill="#E7EEE9" stroke="#2B2622" stroke-width="1.5"/>
  <text x="745" y="148" text-anchor="middle" font-size="14" fill="#2B2622">Local vision model</text>
  <text x="745" y="168" text-anchor="middle" font-size="10.5" fill="#3E6E64">on your own GPU · free</text>
  <text x="745" y="186" text-anchor="middle" font-size="10.5" fill="#6B6259">triages every captured lot</text>

  <!-- cloud llm -->
  <rect x="640" y="300" width="210" height="96" rx="8" fill="#F1E6DC" stroke="#2B2622" stroke-width="1.5"/>
  <text x="745" y="328" text-anchor="middle" font-size="14" fill="#2B2622">Cloud LLM + web search</text>
  <text x="745" y="348" text-anchor="middle" font-size="10.5" fill="#9C6B3F">metered · shortlist only</text>
  <text x="745" y="366" text-anchor="middle" font-size="10.5" fill="#6B6259">deep valuation with cited</text>
  <text x="745" y="382" text-anchor="middle" font-size="10.5" fill="#6B6259">realized sold comps</text>

  <!-- connectors -->
  <g fill="none" stroke="#9C6B3F" stroke-width="2">
    <path d="M190 145 L 246 145" marker-end="url(#a)"/>
    <path d="M340 194 L 340 218" marker-end="url(#a)"/>
    <path d="M340 282 L 340 316" marker-end="url(#a)"/>
    <path d="M430 372 C 520 372, 470 172, 636 165" marker-end="url(#a)"/>
    <path d="M430 400 C 540 400, 560 346, 636 346" marker-end="url(#a)"/>
  </g>
  <g fill="none" stroke="#3E6E64" stroke-width="1.6" stroke-dasharray="4 3">
    <path d="M636 178 C 520 210, 470 250, 436 250" marker-end="url(#b)"/>
    <path d="M636 356 C 520 320, 470 275, 436 262" marker-end="url(#b)"/>
  </g>

  <text x="470" y="500" text-anchor="middle" font-size="11" fill="#6B6259" font-style="italic">Runs as a self-hosted stack; teammates reach it privately over the network. Analysis stays hybrid by design.</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#9C6B3F"/></marker>
    <marker id="b" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#3E6E64"/></marker>
  </defs>
</svg>
