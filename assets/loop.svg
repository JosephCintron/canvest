<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" font-family="Georgia, 'Times New Roman', serif">
  <rect width="920" height="560" rx="14" fill="#F4EEE1"/>
  <rect x="6" y="6" width="908" height="548" rx="10" fill="none" stroke="#2B2622" stroke-width="1.5"/>
  <text x="460" y="46" text-anchor="middle" font-size="24" fill="#2B2622" letter-spacing="1">The Canvest loop</text>
  <text x="460" y="70" text-anchor="middle" font-size="13" fill="#6B6259" font-style="italic">every closed auction and resale sharpens the next cycle</text>

  <!-- ring nodes -->
  <g fill="#FBF7EE" stroke="#2B2622" stroke-width="1.5">
    <rect x="392" y="96"  width="136" height="52" rx="8"/>
    <rect x="628" y="150" width="150" height="52" rx="8"/>
    <rect x="700" y="256" width="150" height="52" rx="8"/>
    <rect x="628" y="360" width="150" height="52" rx="8"/>
    <rect x="392" y="430" width="136" height="52" rx="8"/>
    <rect x="142" y="360" width="150" height="52" rx="8"/>
    <rect x="70"  y="256" width="150" height="52" rx="8"/>
    <rect x="142" y="150" width="150" height="52" rx="8"/>
  </g>
  <g fill="#2B2622" font-size="14" text-anchor="middle">
    <text x="460" y="119">1 · Research</text><text x="460" y="137" font-size="11" fill="#6B6259">market thesis</text>
    <text x="703" y="173">2 · Rubric</text><text x="703" y="191" font-size="11" fill="#6B6259">what we buy</text>
    <text x="775" y="279">3 · Source</text><text x="775" y="297" font-size="11" fill="#6B6259">capture listings</text>
    <text x="703" y="383">4 · Triage</text><text x="703" y="401" font-size="11" fill="#6B6259">free local score</text>
    <text x="460" y="453">5 · Deep valuation</text><text x="460" y="471" font-size="11" fill="#6B6259">cloud LLM + comps</text>
    <text x="217" y="383">6 · Evidence gate</text><text x="217" y="401" font-size="11" fill="#6B6259">bid / no-bid</text>
    <text x="145" y="279">7 · Track</text><text x="145" y="297" font-size="11" fill="#6B6259">bids &amp; price</text>
    <text x="217" y="173">8 · Outcome</text><text x="217" y="191" font-size="11" fill="#6B6259">won / lost / sold</text>
  </g>

  <!-- clockwise arrows -->
  <g fill="none" stroke="#9C6B3F" stroke-width="2">
    <path d="M528 120 C 590 126, 612 140, 636 156" marker-end="url(#ah)"/>
    <path d="M760 202 C 782 220, 786 236, 782 252" marker-end="url(#ah)"/>
    <path d="M770 308 C 762 330, 748 346, 730 356" marker-end="url(#ah)"/>
    <path d="M636 406 C 600 424, 566 432, 530 440" marker-end="url(#ah)"/>
    <path d="M392 456 C 356 448, 322 432, 292 410" marker-end="url(#ah)"/>
    <path d="M162 356 C 150 334, 148 320, 150 306" marker-end="url(#ah)"/>
    <path d="M150 252 C 146 232, 156 216, 176 202" marker-end="url(#ah)"/>
    <path d="M288 156 C 322 138, 356 128, 388 122" marker-end="url(#ah)"/>
  </g>

  <!-- comp library core -->
  <ellipse cx="460" cy="290" rx="120" ry="60" fill="#EAE0CC" stroke="#2B2622" stroke-width="1.5"/>
  <text x="460" y="284" text-anchor="middle" font-size="15" fill="#2B2622">Comp library</text>
  <text x="460" y="305" text-anchor="middle" font-size="11" fill="#6B6259">realized sold prices</text>
  <g fill="none" stroke="#3E6E64" stroke-width="1.6" stroke-dasharray="4 3">
    <path d="M300 386 C 360 360, 400 340, 420 322" marker-end="url(#ah2)"/>
    <path d="M470 350 C 468 388, 466 410, 462 428" marker-end="url(#ah2)"/>
