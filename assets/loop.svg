  <text x="360" y="352" font-size="10" fill="#3E6E64" font-style="italic">outcomes feed comps</text>
  <text x="486" y="392" font-size="10" fill="#3E6E64" font-style="italic">comps ground valuation</text>

  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#9C6B3F"/></marker>
    <marker id="ah2" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#3E6E64"/></marker>
  </defs>
</svg>
